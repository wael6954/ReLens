<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <!-- Film-black background with subtle vignette glow -->
  <defs>
    <radialGradient id="bg" cx="50%" cy="44%" r="62%">
      <stop offset="0%"   stop-color="#1c1816"/>
      <stop offset="100%" stop-color="#0a0908"/>
    </radialGradient>
    <radialGradient id="iris" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#e7c789" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#e7c789" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1024" height="1024" rx="180" fill="url(#bg)"/>

  <!-- Soft inner glow -->
  <circle cx="512" cy="512" r="360" fill="url(#iris)"/>

  <!-- Outer lens ring -->
  <circle cx="512" cy="512" r="330"
          fill="none" stroke="#c8a96e" stroke-width="34"/>

  <!-- Middle ring -->
  <circle cx="512" cy="512" r="230"
          fill="none" stroke="#c8a96e" stroke-width="14" opacity="0.55"/>

  <!-- Inner aperture -->
  <circle cx="512" cy="512" r="146"
          fill="none" stroke="#c8a96e" stroke-width="22"/>

  <!-- Centre pupil -->
  <circle cx="512" cy="512" r="58" fill="#c8a96e"/>

  <!-- Specular highlight -->
  <circle cx="460" cy="460" r="22" fill="#f0d8a8" opacity="0.85"/>

  <!-- Sprocket holes (film aesthetic) — top + bottom -->
  <g fill="#3a3632">
    <rect x="120" y="120" width="42" height="56" rx="6"/>
    <rect x="220" y="120" width="42" height="56" rx="6"/>
    <rect x="762" y="120" width="42" height="56" rx="6"/>
    <rect x="862" y="120" width="42" height="56" rx="6"/>

    <rect x="120" y="848" width="42" height="56" rx="6"/>
    <rect x="220" y="848" width="42" height="56" rx="6"/>
    <rect x="762" y="848" width="42" height="56" rx="6"/>
    <rect x="862" y="848" width="42" height="56" rx="6"/>
  </g>
</svg>
